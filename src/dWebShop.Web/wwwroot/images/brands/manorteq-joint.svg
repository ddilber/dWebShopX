<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t">
  <title id="t">MANORTEQ — brtvena traka u radnom spoju zida i ploče</title>
  <defs>
    <pattern id="mtq-tex" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#f4f1ea" fill-opacity=".12"/>
      <circle cx="4" cy="4" r=".5" fill="#f4f1ea" fill-opacity=".08"/>
    </pattern>
    <linearGradient id="bg-mtq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg-mtq)"/>

  <!-- ground water (left) -->
  <g fill="#2e6db4" fill-opacity=".55">
    <rect x="0" y="300" width="190" height="300"/>
  </g>
  <g fill="#9cc0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill-opacity=".9">
    <text x="40" y="360">H₂O</text>
    <text x="110" y="420">H₂O</text>
    <text x="50" y="490">H₂O</text>
    <text x="120" y="550">H₂O</text>
  </g>

  <!-- slab -->
  <rect x="190" y="430" width="560" height="120" fill="#4a4a52" stroke="#f4f1ea" stroke-opacity=".6" stroke-width="1.4"/>
  <rect x="190" y="430" width="560" height="120" fill="url(#mtq-tex)"/>

  <!-- wall -->
  <rect x="190" y="90" width="150" height="340" fill="#55555e" stroke="#f4f1ea" stroke-opacity=".6" stroke-width="1.4"/>
  <rect x="190" y="90" width="150" height="340" fill="url(#mtq-tex)"/>

  <!-- construction joint line -->
  <line x1="190" y1="430" x2="340" y2="430" stroke="#f4f1ea" stroke-width="1.4" stroke-dasharray="6 5"/>

  <!-- rebar -->
  <g stroke="#b9b3a4" stroke-width="3" stroke-linecap="round" stroke-opacity=".7">
    <line x1="220" y1="110" x2="220" y2="520"/>
    <line x1="310" y1="110" x2="310" y2="520"/>
    <line x1="220" y1="520" x2="720" y2="520"/>
    <line x1="220" y1="460" x2="720" y2="460"/>
  </g>

  <!-- swellable waterbar (swollen, sealing the joint) -->
  <rect x="250" y="412" width="34" height="18" rx="4" fill="#2e6db4" stroke="#9cc0ea" stroke-width="1.4"/>
  <g stroke="#9cc0ea" stroke-width="1.2" fill="none" stroke-opacity=".8">
    <path d="M246 404 q21 -14 42 0"/>
    <path d="M240 396 q27 -22 54 0"/>
  </g>

  <!-- water path blocked -->
  <g stroke="#9cc0ea" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M190 430 H238" stroke-dasharray="4 4"/>
    <path d="M232 422 l10 8 l-10 8"/>
  </g>
  <g stroke="#e05a4a" stroke-width="2.4" stroke-linecap="round">
    <line x1="241" y1="416" x2="249" y2="444"/>
    <line x1="249" y1="416" x2="241" y2="444"/>
  </g>

  <!-- callout -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f4f1ea">
    <line x1="284" y1="412" x2="420" y2="300" stroke="#f4f1ea" stroke-opacity=".5" stroke-width="1"/>
    <circle cx="420" cy="300" r="3" fill="#2e6db4"/>
    <text x="432" y="292" font-size="13" font-weight="700" letter-spacing="1.5">HYDROBAR</text>
    <text x="432" y="312" font-size="11" fill-opacity=".65" letter-spacing="1">BUBRENJE DO 1000 %</text>
    <text x="432" y="330" font-size="11" fill-opacity=".65" letter-spacing="1">RADNI SPOJ ZID / PLOČA</text>
  </g>
</svg>
